<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ISS</title>
    <style>
      /* Minimal reset. All real UI styling belongs to the ui/ subsystem. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #cfd6d3;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        -webkit-font-smoothing: antialiased;
      }
      /* WebGL canvas mount. The renderer appends its canvas here. */
      #app {
        position: fixed;
        inset: 0;
      }
      #app > canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Diegetic DOM overlay: wrist tracker, noise ring, crosshair (§6). */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      /* Pointer-lock / comfort-options / results screens. Interactive. */
      #menu {
        position: fixed;
        inset: 0;
        z-index: 20;
      }
      #menu[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="menu"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
